server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
  location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/kitchen/" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
