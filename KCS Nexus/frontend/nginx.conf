limit_conn_zone $binary_remote_addr zone=nexus_media_uploads:1m;
server {
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/json application/javascript application/manifest+json text/css text/plain text/xml image/svg+xml;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  # PDF.js module workers must be served as JavaScript, never octet-stream.
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location /images/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location ^~ /documents/handbooks/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  index index.html;
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
  # Compatibility for installed/older PWA bundles whose API base is scoped
  # under /nexus. This must be declared before the SPA /nexus/ location;
  # otherwise nginx returns index.html with HTTP 200 and the UI interprets the
  # HTML document as an empty registry.
  location ^~ /nexus/api/ {
    rewrite ^/nexus/api/(.*)$ /api/$1 break;
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /nexus/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    rewrite ^/nexus/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
  # Static document snapshots include embedded logos, photos and high-resolution QR codes.
  location = /api/documents/pdf {
    client_max_body_size 8m;
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
  }
  # Check website permissions before buffering a large request body on disk.
  location = /__nexus_media_upload_auth {
    internal;
    client_max_body_size 501m;
    proxy_pass http://nexus_api:5000/api/media/uploads/access;
    proxy_method GET;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_body off;
  }
  location ^~ /api/media/uploads/ {
    auth_request /__nexus_media_upload_auth;
    limit_conn nexus_media_uploads 2;
    limit_conn_status 429;
    client_max_body_size 501m;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    proxy_request_buffering on;
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
  }
  location ^~ /nexus/api/media/uploads/ {
    auth_request /__nexus_media_upload_auth;
    limit_conn nexus_media_uploads 2;
    limit_conn_status 429;
    client_max_body_size 501m;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    proxy_request_buffering on;
    rewrite ^/nexus/(.*)$ /$1 break;
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
  }
  location /api/ {
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
  }
  # Compatibility for previously installed PWA bundles that posted auth calls
  # without the /api prefix. This prevents nginx from returning HTTP 405.
  location ~ ^/auth/(login|refresh|forgot-password|reset-password)$ {
    rewrite ^/auth/(.*)$ /api/auth/$1 break;
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
