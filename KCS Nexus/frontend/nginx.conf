server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /images/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  index index.html;
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
  location /nexus/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    rewrite ^/nexus/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
  }
  # Compatibility for previously installed PWA bundles that posted auth calls
  # without the /api prefix. This prevents nginx from returning HTTP 405.
  location ~ ^/auth/(login|refresh|forgot-password|reset-password)$ {
    rewrite ^/auth/(.*)$ /api/auth/$1 break;
    proxy_pass http://nexus_api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
