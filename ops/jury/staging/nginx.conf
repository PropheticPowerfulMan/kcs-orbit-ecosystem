pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 types { application/manifest+json webmanifest; }
 default_type application/octet-stream;
 access_log /dev/stdout;
 error_log /dev/stderr warn;
 sendfile on;
 server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://kinshasachristianschool.org https://*.kinshasachristianschool.org; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /sw.js { add_header Cache-Control "no-store" always; add_header Service-Worker-Allowed "/jury/" always; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
