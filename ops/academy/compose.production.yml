services:
  academy:
    build:
      context: ../../KCS Nexus Academy
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      - academy_production_front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  academy_production_front:
    name: kcs_academy_production_front
